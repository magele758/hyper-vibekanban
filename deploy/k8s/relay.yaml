# The live host registry is in-process memory. Keep replicas at 1 until
# that registry is stored in Postgres. ClientIP affinity sticks long-lived
# connections to the same pod. Recreate avoids a second process during rollout.
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: vibekanban
  labels:
    app.kubernetes.io/name: vibekanban
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: hyper-vibekanban
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 86400
  selector:
    app.kubernetes.io/name: vibekanban
    app.kubernetes.io/component: relay
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: vibekanban
  labels:
    app.kubernetes.io/name: vibekanban
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: hyper-vibekanban
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vibekanban
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vibekanban
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: hyper-vibekanban
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-remote
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until wget -q -O /dev/null http://remote:8081/v1/health; do
                echo "waiting for remote migrations"
                sleep 3
              done
      containers:
        - name: relay
          image: ghcr.io/magele758/hyper-vibekanban-relay:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          env:
            - name: RUST_LOG
              value: info
            - name: RELAY_LISTEN_ADDR
              value: 0.0.0.0:8082
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibekanban-secrets
                  key: POSTGRES_PASSWORD
            - name: SERVER_DATABASE_URL
              value: postgres://remote:$(POSTGRES_PASSWORD)@postgres:5432/remote
            - name: VIBEKANBAN_REMOTE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibekanban-secrets
                  key: VIBEKANBAN_REMOTE_JWT_SECRET
          ports:
            - name: http
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
