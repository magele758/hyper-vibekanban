apiVersion: v1
kind: Secret
metadata:
  name: vibekanban-secrets
  namespace: vibekanban
  labels:
    app.kubernetes.io/name: vibekanban
    app.kubernetes.io/part-of: hyper-vibekanban
type: Opaque
stringData:
  # Keep these names. Connection strings and probes use them.
  POSTGRES_USER: remote
  POSTGRES_DB: remote
  # Letters and digits only. Change both before the first boot.
  # After the data directory is initialized, editing these does not
  # alter the password already stored in the Postgres PVC.
  POSTGRES_PASSWORD: changeme
  ELECTRIC_ROLE_PASSWORD: changeme
  # openssl rand -base64 48
  # Standard base64, at least 32 bytes after decoding.
  # Remote and Relay both read this key.
  VIBEKANBAN_REMOTE_JWT_SECRET: REPLACE_WITH_openssl_rand_base64_48
  # At least one login method is required. Replace these, or remove
  # them and set GitHub/Google OAuth keys instead (see README).
  SELF_HOST_LOCAL_AUTH_EMAIL: admin@example.com
  SELF_HOST_LOCAL_AUTH_PASSWORD: changeme
