# Unsigned desktop installers for local use.
# Full + lite × macOS arm64, Windows x64, Linux x64, Linux arm64.
#
# Artifacts:
#   vibe-kanban-macos-arm64
#   vibe-kanban-windows-x64
#   vibe-kanban-linux-x64
#   vibe-kanban-linux-arm64
#   maestro-macos-arm64
#   maestro-windows-x64
#   maestro-linux-x64
#   maestro-linux-arm64
#
# Trigger: Actions → “Desktop artifacts” → Run workflow
# or open a PR that touches this file. Cloud agents cannot workflow_dispatch;
# they can push a desktop-v* tag instead.

name: Desktop artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-artifacts.yml'
      - 'crates/tauri-app/**'
      - 'crates/server/**'
      - 'crates/local-deployment/**'
      - 'crates/utils/**'
      - 'packages/local-web/**'
      - 'packages/web-core/**'
      - 'packages/ui/**'
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  SQLX_OFFLINE: 'true'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  VITE_VK_SHARED_API_BASE: ''
  # macos-15 default Node heap (~2GB) OOMs during vite minify of local-web.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
            artifact: vibe-kanban-macos-arm64
            rust_target: aarch64-apple-darwin
            bundles: dmg
            tauri_config: tauri.ci.json
            cargo_features: ''
            vite_lite: ''
          - os: macos-15
            name: lite-macos-arm64
            artifact: maestro-macos-arm64
            rust_target: aarch64-apple-darwin
            bundles: dmg
            tauri_config: tauri.ci.lite.json
            cargo_features: lite
            vite_lite: '1'
          - os: windows-latest
            name: windows-x64
            artifact: vibe-kanban-windows-x64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            tauri_config: tauri.ci.json
            cargo_features: ''
            vite_lite: ''
          - os: windows-latest
            name: lite-windows-x64
            artifact: maestro-windows-x64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            tauri_config: tauri.ci.lite.json
            cargo_features: lite
            vite_lite: '1'
          - os: ubuntu-24.04
            name: linux-x64
            artifact: vibe-kanban-linux-x64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            tauri_config: tauri.ci.json
            cargo_features: ''
            vite_lite: ''
          - os: ubuntu-24.04
            name: lite-linux-x64
            artifact: maestro-linux-x64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            tauri_config: tauri.ci.lite.json
            cargo_features: lite
            vite_lite: '1'
          - os: ubuntu-24.04-arm
            name: linux-arm64
            artifact: vibe-kanban-linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb
            tauri_config: tauri.ci.json
            cargo_features: ''
            vite_lite: ''
          - os: ubuntu-24.04-arm
            name: lite-linux-arm64
            artifact: maestro-linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb
            tauri_config: tauri.ci.lite.json
            cargo_features: lite
            vite_lite: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local-web (embedded by server)
        env:
          VITE_VK_LITE: ${{ matrix.vite_lite }}
        run: pnpm --filter @vibe/local-web run build

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libfuse2 \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: desktop-${{ matrix.name }}
          cache-on-failure: true

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build desktop bundle
        working-directory: crates/tauri-app
        env:
          # Skip Apple code signing / notarization (unsigned, local use).
          APPLE_SIGNING_IDENTITY: '-'
          CI: 'true'
          VK_LITE: ${{ matrix.vite_lite }}
        run: |
          FEATURES_ARGS=()
          if [ -n "${{ matrix.cargo_features }}" ]; then
            FEATURES_ARGS=(--features "${{ matrix.cargo_features }}")
          fi
          tauri build \
            "${FEATURES_ARGS[@]}" \
            --target ${{ matrix.rust_target }} \
            --bundles ${{ matrix.bundles }} \
            --config ${{ matrix.tauri_config }}

      - name: List bundle output
        run: |
          echo "Bundle tree:"
          find target/${{ matrix.rust_target }}/release/bundle -type f 2>/dev/null || true
          find target/release/bundle -type f 2>/dev/null || true

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.rust_target }}/release/bundle/macos/*.app
            target/${{ matrix.rust_target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
