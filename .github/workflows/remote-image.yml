name: Build & Publish Images

# Builds the self-hosted Remote and Relay server images and publishes them to
# GitHub Container Registry (GHCR), multi-arch (linux/amd64 + linux/arm64).
# Deployments then only pull the images instead of compiling locally.
#
#   remote: crates/remote/Dockerfile        -> ghcr.io/<owner>/hyper-vibekanban-remote
#   relay : crates/relay-tunnel/Dockerfile  -> ghcr.io/<owner>/hyper-vibekanban-relay
#
# Build cadence: at most ONCE PER DAY. This does NOT build on every push.
# A daily scheduled run builds only when the relevant source changed since the
# previous day (the `changes` job gates it); release tags and manual runs build
# on demand. Each architecture is built on its NATIVE runner (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm — free for public repos) then merged
# into one multi-arch manifest, avoiding slow QEMU emulation.
#
# FEATURES is intentionally empty for remote: the Dockerfile strips the private
# `billing` crate in that mode, so no private repo / SSH access is required.
# GHCR uses the built-in GITHUB_TOKEN — no extra secrets needed.

on:
  schedule:
    # Once per day at 19:00 UTC. Builds only if relevant source changed.
    - cron: '0 19 * * *'
  push:
    tags:
      - 'remote-v*'
      - 'relay-v*'
    # TEMP: validate on this feature branch; removed before merge.
    branches:
      - cursor/throttle-image-builds-6d19
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there were no relevant changes'
        type: boolean
        default: false

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          FORCE: ${{ github.event.inputs.force }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Paths whose changes warrant a new image (clock-independent diff below).
          paths="crates/remote crates/relay-tunnel crates/relay-tunnel-core crates/relay-control crates/relay-protocol crates/relay-ws crates/relay-types crates/ws-bridge crates/api-types packages/remote-web packages/web-core .github/workflows/remote-image.yml"

          # Manual force, or a release tag push -> always build.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "Reason: manual force"; echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            echo "Reason: release tag"; echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Otherwise (scheduled / manual no-force): build only if the relevant
          # source changed since the LAST BUILT image. We read the last built
          # commit from the newest `sha-<short>` tag on the published image
          # (metadata is clock-independent, unlike --since).
          last_tag="$(gh api -H 'Accept: application/vnd.github+json' \
            "/users/${OWNER}/packages/container/hyper-vibekanban-remote/versions?per_page=100" \
            --jq '[.[] | .metadata.container.tags[]? | select(startswith("sha-"))] | .[0]' 2>/dev/null || true)"
          last_sha="${last_tag#sha-}"

          if [ -z "$last_sha" ]; then
            echo "Reason: no prior image found — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git cat-file -e "${last_sha}^{commit}" 2>/dev/null; then
            echo "Reason: last built commit ${last_sha} not in history — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "${last_sha}" HEAD -- $paths; then
            echo "Reason: no relevant changes since last build (${last_sha}) — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Reason: relevant changes since last build (${last_sha}) — building"
            git diff --stat "${last_sha}" HEAD -- $paths | sed 's/^/  /'
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: remote, image: hyper-vibekanban-remote, dockerfile: crates/remote/Dockerfile, arch: amd64, runner: ubuntu-latest }
          - { name: remote, image: hyper-vibekanban-remote, dockerfile: crates/remote/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
          - { name: relay,  image: hyper-vibekanban-relay,  dockerfile: crates/relay-tunnel/Dockerfile, arch: amd64, runner: ubuntu-latest }
          - { name: relay,  image: hyper-vibekanban-relay,  dockerfile: crates/relay-tunnel/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build args (remote only)
        id: args
        run: |
          if [ "${{ matrix.name }}" = "remote" ]; then
            {
              echo 'build_args<<EOF'
              echo 'FEATURES='
              echo 'VITE_RELAY_API_BASE_URL=${{ vars.VITE_RELAY_API_BASE_URL }}'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'build_args=' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest (${{ matrix.name }}/${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.build_args }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [changes, build]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: remote, image: hyper-vibekanban-remote }
          - { name: relay,  image: hyper-vibekanban-relay }
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          sources=""
          for f in /tmp/digests/*; do
            sources="$sources ${IMAGE}@$(cat "$f")"
          done
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Merging: $sources"
          docker buildx imagetools create $tags $sources

      - name: Inspect manifest
        run: |
          ref=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$ref"

  cleanup:
    needs: [changes, merge]
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package:
          - hyper-vibekanban-remote
          - hyper-vibekanban-relay
    steps:
      - name: Prune old image versions (keep newest 10)
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
