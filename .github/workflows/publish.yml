name: Publish to npm

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.2.3)"
        required: true
      release_id:
        description: "GitHub release ID"
        required: true

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write  # Required for OIDC trusted publishing

env:
  # Node 22.22.2 regresses `npm install -g npm@...` with
  # `Cannot find module 'promise-retry'`. Pin a known-good patch until the
  # upstream Node/npm regression is resolved.
  NODE_VERSION: 22.22.1
  PNPM_VERSION: 10.13.1

jobs:
  publish:
    runs-on: ubuntu-latest
    # release-stable.yml dispatches this workflow with a stable tarball.
    # A prerelease version keeps its channel dist-tag. Only a version with no
    # hyphen is published as latest. Retry a failed npm publish by dispatching
    # this workflow again; do not re-run an old release job.
    # remote-* / relay-* tags are image releases, not the npm package.
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)) && !startsWith(github.event.release.tag_name || inputs.tag_name, 'remote-') && !startsWith(github.event.release.tag_name || inputs.tag_name, 'relay-') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.12.0

      - name: Download npm package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_NAME}" ]; then
            echo "No release tag." >&2
            exit 1
          fi
          mkdir -p npx-cli
          gh release download "${TAG_NAME}" --pattern '*.tgz' --dir npx-cli --clobber
          count=0
          pkg=""
          for file in npx-cli/*.tgz; do
            if [ ! -f "$file" ]; then
              continue
            fi
            count=$((count + 1))
            pkg="$(basename "$file")"
          done
          if [ "$count" -ne 1 ]; then
            echo "Expected one .tgz asset, found ${count}." >&2
            exit 1
          fi
          echo "package-file=${pkg}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: |
          set -euo pipefail
          SCRIPT="npx-cli/scripts/publish-npm.js"
          if [ ! -f "$SCRIPT" ]; then
            echo "This tag does not include the publish script; using the default branch copy."
            git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
            git checkout FETCH_HEAD -- "$SCRIPT" npx-cli/scripts/npm-release.js
          fi
          pkg="npx-cli/${{ steps.package.outputs.package-file }}"
          abs="$(node -e 'const path=require("path"); process.stdout.write(path.resolve(process.argv[1]))' "$pkg")"
          case "$abs" in
            /*) ;;
            *)
              echo "Refusing relative tarball path: ${pkg}" >&2
              exit 1
              ;;
          esac
          node "$SCRIPT" "$abs"

      - name: Update release description
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const releaseId = Number(
              context.payload.release?.id || process.env.RELEASE_ID
            );
            if (!releaseId) {
              core.warning('No release id; skipped the npm publish note.');
              return;
            }
            const marker = '✅ **Published to npm registry**';
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });
            const currentBody = release.data.body || '';
            if (currentBody.includes(marker)) {
              core.notice('Release notes already record the npm publish.');
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: `${currentBody}\n\n${marker}`
            });
