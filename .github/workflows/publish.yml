name: Publish to npm

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.2.3)"
        required: true
      release_id:
        description: "GitHub release ID"
        required: true

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write  # Required for OIDC trusted publishing

env:
  # Node 22.22.2 regresses `npm install -g npm@...` with
  # `Cannot find module 'promise-retry'`. Pin a known-good patch until the
  # upstream Node/npm regression is resolved.
  NODE_VERSION: 22.22.1
  PNPM_VERSION: 10.13.1

jobs:
  publish:
    runs-on: ubuntu-latest
    # Automatic publishes run from pre-release.yml. This workflow publishes when
    # a pre-release is promoted, or when dispatched to retry a release.
    # remote-* / relay-* tags are image releases, not the npm package.
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false)) && !startsWith(github.event.release.tag_name || inputs.tag_name, 'remote-') && !startsWith(github.event.release.tag_name || inputs.tag_name, 'relay-') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11.12.0

      - name: Download release assets
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const releaseId = context.payload.release?.id || process.env.RELEASE_ID;
            console.log("releaseId:", releaseId);

            if (!releaseId) {
              core.setFailed('No release ID found.');
              return;
            }

            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });
            
            // Find the .tgz file
            const tgzAsset = release.data.assets.find(asset => asset.name.endsWith('.tgz'));
            
            if (!tgzAsset) {
              core.setFailed('No .tgz file found in release assets');
              return;
            }
            
            // Download the asset
            const response = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: tgzAsset.id,
              headers: {
                Accept: 'application/octet-stream'
              }
            });
            
            // Save to npx-cli directory
            const filePath = path.join('npx-cli', tgzAsset.name);
            fs.writeFileSync(filePath, Buffer.from(response.data));
            
            console.log(`Downloaded ${tgzAsset.name} to ${filePath}`);
            
            // Set output for next step
            core.setOutput('package-file', filePath);
            core.setOutput('package-name', tgzAsset.name);

      - name: Verify package integrity
        id: verify
        run: |
          cd npx-cli
          
          # List files to confirm download
          ls -la *.tgz
          
          # Verify the package can be read
          npm pack --dry-run || echo "Note: This is expected to show differences since we're using the pre-built package"
          
          # Extract package name from the downloaded file
          PACKAGE_FILE=$(ls *.tgz | head -n1)
          echo "package-file=$PACKAGE_FILE" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: |
          SCRIPT="npx-cli/scripts/publish-npm.js"
          if [ ! -f "$SCRIPT" ]; then
            echo "This tag does not include the publish script; using the default branch copy."
            git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
            git checkout FETCH_HEAD -- "$SCRIPT" npx-cli/scripts/npm-release.js
          fi
          node "$SCRIPT" "npx-cli/${{ steps.verify.outputs.package-file }}"

      - name: Update release description
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        with:
          script: |
            const releaseId = Number(
              context.payload.release?.id || process.env.RELEASE_ID
            );
            if (!releaseId) {
              core.warning('No release id; skipped the npm publish note.');
              return;
            }
            const marker = '✅ **Published to npm registry**';
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId
            });
            const currentBody = release.data.body || '';
            if (currentBody.includes(marker)) {
              core.notice('Release notes already record the npm publish.');
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: `${currentBody}\n\n${marker}`
            });
